<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompass">
<title>Kompass Apps – Startseite</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.thema=localStorage.getItem("kompass_thema")||"dunkel"}catch(e){}</script>
<style>
:root{--bg:var(--bg);--card:#0f1620;--card2:#0b1118;--line:#1b2532;--txt:#dfe6ef;--mut:#7f8b9c;
 --grn:#1fcf8f;--red:#f0605d;--gold:#f5c542;--blue:#4c9aff;--lila:#b388ff;--orange:#ff9f43;--acc:var(--grn);
 --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);padding:18px 14px 40px;font-size:15.5px;line-height:1.5;
 background-image:radial-gradient(900px 400px at 100% -10%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%)}
.wrap{max-width:1240px;margin:0 auto}
a{color:var(--acc)}
/* ---------- Kopf ---------- */
header.kopf{margin-bottom:18px}
.zurueck{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-decoration:none;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:10px;margin-bottom:16px;transition:.2s}
.zurueck:hover{color:var(--acc);border-color:var(--acc)}
.meta{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
h1{font-family:var(--mono);font-weight:800;font-size:1.65rem;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);text-shadow:0 0 24px color-mix(in srgb,var(--acc) 35%,transparent);line-height:1.15}
h2{font-family:var(--mono);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
/* ---------- Navigation als Pillen ---------- */
nav{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 18px;padding:2px 14px 6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:12px;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;transition:.2s}
nav button:hover{color:var(--txt)}
nav button.an{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 18%,transparent)}
/* ---------- Karten ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc);opacity:.85}
.card h2{margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;width:90px;height:90px;right:-30px;top:-30px;border-radius:50%;background:var(--acc);opacity:.08;filter:blur(10px)}
.kpi .l{font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.kpi .w{font-family:var(--mono);font-size:1.35rem;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* ---------- Formulare ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 11px;font-size:.95rem;font-family:var(--sans);letter-spacing:0;text-transform:none;font-weight:400;transition:.2s;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
input[type=checkbox]{accent-color:var(--acc);width:18px;height:18px}
textarea{min-height:70px;grid-column:1/-1}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);padding:10px 16px;border-radius:12px;font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.2s}
.btn:hover{background:color-mix(in srgb,var(--acc) 22%,var(--card));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 22%,transparent)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.grau{background:var(--card2);color:var(--txt);border-color:var(--line)}
.btn.grau:hover{border-color:var(--mut);box-shadow:none}
.btn.rot{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.reihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calc{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--mut);padding:6px 0}
.calc span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.calc b{color:var(--txt);font-family:var(--mono)}
/* ---------- Tabellen ---------- */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);color:var(--mut);font-weight:700;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
td{font-variant-numeric:tabular-nums}
tr.zeile{cursor:pointer;transition:.15s}tr.zeile:hover{background:var(--card2)}
.scroll{overflow-x:auto}
.up{color:var(--grn)}.down{color:var(--red)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.tag.offen{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 55%,transparent)}
.tag.frei{color:var(--grn);border-color:color-mix(in srgb,var(--grn) 55%,transparent)}
.tag.bald{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
canvas{width:100%;height:240px;display:block}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hinweis{font-size:.82rem;color:var(--mut);margin-top:10px;line-height:1.55}
.hinweis b{color:var(--txt)}
.leer{color:var(--mut);text-align:center;padding:26px;white-space:normal}
.mini{font-size:.8rem;color:var(--mut)}
.bild{max-width:100%;border-radius:12px;margin-top:8px}
/* Infobox mit farbiger Überschrift */
.info{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.info .k{font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
/* Dialog */
#dlg{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
@media(min-width:700px){#dlg{align-items:center}}
#dlg .card{max-width:640px;width:100%;max-height:88vh;overflow:auto;animation:hoch .3s ease}
/* ---------- Animationen ---------- */
@keyframes rein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes hoch{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
section:not([hidden])>*,.kpis>*,.anim>*{animation:rein .45s cubic-bezier(.2,.7,.2,1) both}
section:not([hidden])>*:nth-child(2),.kpis>*:nth-child(2),.anim>*:nth-child(2){animation-delay:.05s}
section:not([hidden])>*:nth-child(3),.kpis>*:nth-child(3),.anim>*:nth-child(3){animation-delay:.1s}
section:not([hidden])>*:nth-child(4),.kpis>*:nth-child(4),.anim>*:nth-child(4){animation-delay:.15s}
section:not([hidden])>*:nth-child(5),.kpis>*:nth-child(5),.anim>*:nth-child(5){animation-delay:.2s}
section:not([hidden])>*:nth-child(n+6),.kpis>*:nth-child(n+6),.anim>*:nth-child(n+6){animation-delay:.25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}

/* ---------- Hell-Modus ---------- */
html[data-thema=hell]{--bg:#f3f5f8;--card:#ffffff;--card2:#eef1f5;--line:#d7dde5;--txt:#111a26;--mut:#5d6878;
 --grn:#0fa872;--red:#d9443f;--gold:#c99a0a;--blue:#2f7be0;--lila:#8a5ce6;--orange:#e7801c}
html[data-thema=hell] body{background-image:radial-gradient(900px 400px at 100% -10%,color-mix(in srgb,var(--acc) 7%,transparent),transparent 70%)}
html[data-thema=hell] .card,html[data-thema=hell] .kpi,html[data-thema=hell] .k{box-shadow:0 1px 3px #0000000d}
html[data-thema=hell] h1{text-shadow:none}
html,body{transition:background-color .3s,color .3s}
header.kopf{position:relative}
.thema{position:absolute;right:0;top:0;width:42px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:1.1rem;cursor:pointer;transition:.2s;z-index:3}
.thema:hover{border-color:var(--acc);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 25%,transparent)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
#uhr{font-family:var(--mono);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;color:var(--txt);letter-spacing:.02em}
#uhr small{font-size:.55em;color:var(--mut);margin-left:2px}
.suche{width:100%;padding:13px 16px;border-radius:14px;font-size:1rem;margin-bottom:6px}
/* Bento */
.bento{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.bento{grid-template-columns:repeat(3,1fr)}}
@media(min-width:640px){.k.breit{grid-column:span 2}}
@media(min-width:640px) and (max-width:999px){.k.voll2{grid-column:span 2}}
@media(min-width:1000px){.k.voll3{grid-column:span 3}.k.voll3b{grid-column:span 2}}
.k{--f:var(--grn);position:relative;display:flex;flex-direction:column;min-height:150px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;text-decoration:none;color:var(--txt);overflow:hidden;transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s}
.k::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--f);box-shadow:0 0 14px var(--f)}
.k::after{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-70px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--f) 30%,transparent),transparent 70%);pointer-events:none;transition:.3s}
.k:hover,.k:active{transform:translateY(-4px);border-color:var(--f);box-shadow:0 12px 30px -10px color-mix(in srgb,var(--f) 45%,transparent)}
.k:hover::after{opacity:1.4;transform:scale(1.15)}
.k .t{font-family:var(--mono);font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--f);padding-right:56px;line-height:1.25}
.k .i{position:absolute;right:16px;top:14px;font-size:2.4rem;line-height:1;filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--f) 40%,transparent));z-index:1}
.k .d{color:var(--mut);font-size:.9rem;margin-top:8px;line-height:1.45;padding-right:52px}
@media(max-width:639px){.k{min-height:0}}
.k .fuss{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.k .fuss .pf{margin-left:auto;font-size:1.4rem;color:var(--f);line-height:1;transition:.25s}
.k:hover .pf{transform:translateX(4px)}
.k .neu{color:var(--f);border:1px solid var(--f);border-radius:999px;padding:1px 8px;background:var(--bg)}
.k .bar{flex:1;height:5px;background:var(--card2);border-radius:4px;overflow:hidden;max-width:160px}
.k .bar div{height:100%;background:var(--f);box-shadow:0 0 8px var(--f);border-radius:4px}
.stern{position:absolute;right:62px;top:16px;z-index:2;background:none;border:none;font-size:1rem;cursor:pointer;color:#2a3646;transition:.2s}
.stern.an{color:var(--gold);text-shadow:0 0 10px var(--gold)}
.bereich{margin-top:30px;scroll-margin-top:12px}
.bereich .bk{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.bereich h2{font-size:.9rem}
.bereich .anz{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--mut)}
/* Info-Kacheln */
.w-gross{font-family:var(--mono);font-weight:800;font-size:2.1rem;margin-top:10px;letter-spacing:-.01em}
.kurs{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
.kurs:last-child{border:none}
.kurs b{color:var(--txt)}
.pille{font-family:var(--mono);font-size:.72rem;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 8px;margin-left:8px;background:var(--bg)}
footer{color:var(--mut);font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin:36px 0 10px}
</style>
</head>
<body style="--acc:var(--grn)">
<div class="wrap">
<div class="top">
 <div><div class="meta" id="meta">&nbsp;</div><h1>Kompass Apps</h1><div class="mini" id="gruss" style="margin-top:6px"></div></div>
 <div style="display:flex;gap:10px;align-items:center"><div id="uhr"></div><button class="thema" id="themaBtn" title="Hell/Dunkel" style="position:static">☀️</button></div>
</div>

<div class="bento anim" id="infos">
 <div class="k" style="--f:var(--gold)"><div class="t">Wetter Ergolding</div><div class="i" id="w-ico">🌤️</div>
  <div class="w-gross" id="w-temp">–</div><div class="d" id="w-txt">wird geladen …</div>
  <div class="fuss"><span id="w-mm">Min / Max</span><div class="bar"><div id="w-bar" style="width:0"></div></div></div></div>
 <div class="k" style="--f:var(--grn)"><div class="t">Krypto 24 h</div><div class="i">₿</div>
  <div id="krypto" style="margin-top:10px"><div class="d">wird geladen …</div></div>
  <div class="fuss"><span id="k-stand">Stand –</span><a class="pf" href="https://markt.kompassapps.de" style="text-decoration:none">›</a></div></div>
 <div class="k" style="--f:var(--blue)"><div class="t">Heute</div><div class="i">📅</div>
  <div class="w-gross" id="datum" style="font-size:1.35rem"></div><div class="d" id="kw"></div>
  <div class="fuss"><span id="jahrTxt"></span><div class="bar"><div id="jahrBar" style="width:0"></div></div></div></div>
</div>

<div style="margin-top:22px"><input class="suche" id="suche" placeholder="🔍  App suchen …" autocomplete="off"></div>
<nav id="spruenge" style="margin:14px -14px 0"></nav>
<div id="bereiche"></div>
<footer>kompassapps.de · ★ antippen = Favorit</footer>
</div>

<script>/* gemeinsame Helfer */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DB={db:null,name:"app",
 async open(n){this.name=n;return new Promise(r=>{try{const q=indexedDB.open(n,1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 async get(k){if(!this.db){try{return JSON.parse(localStorage.getItem(this.name+"_"+k))}catch(e){return null}}
  return new Promise(r=>{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)})},
 async set(k,v){if(!this.db){try{localStorage.setItem(this.name+"_"+k,JSON.stringify(v))}catch(e){}return}
  return new Promise(r=>{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=r;t.onerror=r})}
};
const eur=(v,d=2)=>v==null||isNaN(v)?"–":(+v).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d})+" €";
const zahl=(v,d=0)=>v==null||isNaN(v)?"–":(+v).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const fdat=s=>s?new Date(s+"T12:00").toLocaleDateString("de-DE"):"–";
const heute=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tageZw=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function datei(name,inhalt,typ,info){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([inhalt],{type:typ}));a.download=name;document.body.appendChild(a);a.click();a.remove();info&&(info.textContent="✅ Datei heruntergeladen.")}catch(e){info&&(info.textContent="Herunterladen ging nicht – nutze „Als Text kopieren“.")}}
async function kopiere(t,info){try{await navigator.clipboard.writeText(t);info&&(info.textContent="✅ Kopiert.")}catch(e){info&&(info.textContent="Kopieren nicht möglich.")}}
function zweimal(btn,text){if(btn.dataset.ok!=="1"){btn.dataset.ok="1";btn.dataset.alt=btn.textContent;btn.textContent=text||"Wirklich? Nochmal tippen";setTimeout(()=>{if(btn.dataset.ok==="1"){btn.dataset.ok="";btn.textContent=btn.dataset.alt}},4000);return false}btn.dataset.ok="";btn.textContent=btn.dataset.alt;return true}
/* Sicherungs-Bereich: el = Container, getData()/setData(obj) */
function sicherung(el,app,getData,setData){
 el.innerHTML=`<div class="card"><h2>💾 Sicherung</h2><p class="hinweis" style="margin-bottom:12px">Deine Daten sind nur in diesem Browser gespeichert. Sichere sie ab und zu als Datei – so kannst du sie auch auf ein anderes Gerät holen.</p>
 <div class="reihe"><button class="btn" data-a="ex">⬇️ Sicherung herunterladen</button><button class="btn grau" data-a="cp">📋 Als Text kopieren</button>
 <label class="btn grau" style="flex-direction:row;color:var(--txt)">⬆️ Sicherung laden<input type="file" accept=".json,application/json" hidden></label></div><div class="hinweis" data-a="info"></div></div>`;
 const info=el.querySelector('[data-a=info]');
 const js=()=>JSON.stringify({app,datum:new Date().toISOString(),daten:getData()});
 el.querySelector('[data-a=ex]').onclick=()=>datei(app+"-"+heute()+".json",js(),"application/json",info);
 el.querySelector('[data-a=cp]').onclick=()=>kopiere(js(),info);
 el.querySelector('input[type=file]').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!==app)throw 0;await setData(d.daten);info.textContent="✅ Sicherung geladen."}catch(err){info.textContent="❌ Diese Datei passt nicht zu dieser App."}};
}
/* Farben aus CSS lesen */
const farbeVar=n=>getComputedStyle(document.body).getPropertyValue(n).trim()||"#7f8b9c";
/* Pille im Diagramm: dunkler Hintergrund, farbiger Rahmen, Mono-Schrift */
function pille(g,text,x,y,farbe,ausr="center"){g.font="700 11px 'JetBrains Mono',monospace";const w=g.measureText(text).width+14,h=20;
 let x0=ausr==="center"?x-w/2:ausr==="right"?x-w:x;x0=Math.max(2,Math.min(x0,g.canvas.clientWidth-w-2));
 g.fillStyle=farbeVar("--bg");g.strokeStyle=farbe;g.lineWidth=1;g.beginPath();g.roundRect(x0,y-h/2,w,h,10);g.fill();g.stroke();
 g.fillStyle=farbe;g.textBaseline="middle";g.fillText(text,x0+7,y+1);g.textBaseline="alphabetic"}
/* Balkendiagramm im Terminal-Look */
function balken(canvas,labels,werte,opt={}){const d=devicePixelRatio||1,W=canvas.clientWidth,H=opt.h||230;canvas.width=W*d;canvas.height=H*d;canvas.style.height=H+"px";const g=canvas.getContext("2d");g.scale(d,d);g.clearRect(0,0,W,H);

 const mx=Math.max(...werte,0)*1.18||1,L=44,B=26,T=14,bw=(W-L-6)/werte.length;
 g.font="600 10px 'JetBrains Mono',monospace";g.strokeStyle=farbeVar("--line");g.setLineDash([3,4]);
 for(let i=0;i<=3;i++){const v=mx*i/3,y=T+(H-T-B)*(1-i/3);g.beginPath();g.moveTo(L,y);g.lineTo(W,y);g.stroke();g.fillStyle=farbeVar("--mut");g.fillText(zahl(v,v<10&&mx<10?1:0),2,y+4)}
 g.setLineDash([]);
 const imax=werte.indexOf(Math.max(...werte));
 werte.forEach((v,i)=>{const h=(H-T-B)*(v/mx),x=L+i*bw+bw*.18,w=bw*.64,y=H-B-h;
  const gr=g.createLinearGradient(0,y,0,H-B);gr.addColorStop(0,acc);gr.addColorStop(1,acc+"33");
  g.save();if(i===imax){g.shadowColor=acc;g.shadowBlur=14}g.fillStyle=gr;g.beginPath();g.roundRect(x,y,w,h,[4,4,0,0]);g.fill();g.restore();
  g.fillStyle=farbeVar("--mut");g.font="600 10px 'JetBrains Mono',monospace";if(werte.length<=14||i%2===0)g.fillText(labels[i],L+i*bw+bw*.5-g.measureText(labels[i]).width/2,H-8)});
 if(werte[imax])pille(g,(opt.fmt||zahl)(werte[imax]),L+imax*bw+bw/2,T+(H-T-B)*(1-werte[imax]/mx)-14,acc);
}
